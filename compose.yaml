services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: taskflow
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Définir DB_PASSWORD dans .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  api:
    build: .
    environment:
      DB_HOST: db
      DB_NAME: taskflow
      DB_USER: taskflow
      DB_PASSWORD: ${DB_PASSWORD:?Définir DB_PASSWORD dans .env}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/readyz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  front:
    build:
      context: .
      dockerfile: front/Dockerfile
    environment:
      API_URL: http://api:3000
    ports:
      - "127.0.0.1:${FRONT_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
