apiVersion: apps/v1
kind: Deployment
metadata:
  name: front
  namespace: taskflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: taskflow
      component: front
  template:
    metadata:
      labels:
        app: taskflow
        component: front
    spec:
      containers:
        - name: front
          image: tlemray/taskflow-front:1.0.1
          env:
            - name: API_URL
              value: http://api:3000
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: front
  namespace: taskflow
spec:
  type: LoadBalancer
  selector:
    app: taskflow
    component: front
  ports:
    - port: 8080
      targetPort: 80
